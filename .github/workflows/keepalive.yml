name: Keepalive

# Supabase free projects pause after 7 days without activity. /health/ready
# runs a real query, so one daily hit keeps the database awake.
# Set the BACKEND_URL repository variable (e.g. https://slrs-backend.onrender.com).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.BACKEND_URL != ''
    steps:
      - name: Hit readiness endpoint (retries cover Render cold starts)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 "${{ vars.BACKEND_URL }}/health/ready"
